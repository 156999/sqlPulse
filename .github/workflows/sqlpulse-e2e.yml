name: SQLPulse E2E

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PIP_INDEX_URL: https://pypi.org/simple
      MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
      APP_SECRET_KEY: ${{ secrets.CI_APP_SECRET_KEY }}
      TEST_DB_HOST: mysql
      TEST_DB_PORT: "3306"
      TEST_DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install "pytest>=8" "httpx>=0.27"

      - name: Start sqlPulse and MySQL
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run end-to-end tests
        run: |
          mkdir -p test-results
          python -m pytest tests/integration/test_e2e.py -v --junitxml=test-results/e2e.xml

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose logs --no-color > test-results/compose.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlpulse-e2e-${{ github.run_id }}
          path: test-results/
