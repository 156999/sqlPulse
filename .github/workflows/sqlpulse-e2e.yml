name: SQLPulse E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PIP_INDEX_URL: https://pypi.org/simple
      # Test-only credentials for this job's disposable services; fork PRs have no repository secrets.
      MYSQL_ROOT_PASSWORD: sqlpulse-ci-mysql-password
      APP_SECRET_KEY: sqlpulse-ci-session-secret
      WEB_PORT: "8080"
      MYSQL_HOST_PORT: "3307"
      # The API forwards this DSN to the web container, which resolves the mysql service name.
      TEST_DB_HOST: mysql
      TEST_DB_PORT: "3306"
      TEST_DB_PASSWORD: sqlpulse-ci-mysql-password
      # Direct database tests run on the host through the published MySQL port.
      SQLPULSE_TEST_MYSQL: "1"
      TEST_MYSQL_HOST: "127.0.0.1"
      TEST_MYSQL_PORT: "3307"
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: sqlpulse-ci-mysql-password
      TEST_MYSQL_DATABASE: sqlpulse_demo

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Start sqlPulse and MySQL
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run end-to-end tests
        run: |
          mkdir -p test-results
          python -m pytest tests/integration -v --junitxml=test-results/e2e.xml

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose logs --no-color > test-results/compose.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlpulse-e2e-${{ github.run_id }}
          path: test-results/

      - name: Stop test services
        if: always()
        run: docker compose down --volumes --remove-orphans
