{% extends "base.html" %}
{% block title %}Sign In · SQL Pulse{% endblock %}
{% block nav_login %}class="active"{% endblock %}
{% block content %}
<div class="auth-panel">
  <div class="card auth-card">
    <h1>Sign In to SQL Pulse</h1>
    {% if error %}<p class="hint err auth-error">{{ (error)|ui_text }}</p>{% endif %}
    <form method="post" action="/login" class="auth-form">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-row">
        <label>Username</label>
        <input type="text" name="username" value="{{ username or '' }}" required minlength="3" maxlength="32" autocomplete="username" autofocus>
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password">
      </div>
      <div class="form-actions">
        <button type="submit" class="primary">Sign In</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
