{% extends "base.html" %}
{% block title %}Sign Up · SQL Pulse{% endblock %}
{% block nav_register %}class="active"{% endblock %}
{% block content %}
<div class="auth-panel">
  <div class="card auth-card">
    <h1>Create a SQL Pulse Account</h1>
    {% if error %}<p class="hint err auth-error">{{ (error)|ui_text }}</p>{% endif %}
    <form method="post" action="/register" class="auth-form">
      <div class="form-row">
        <label>Username</label>
        <input type="text" name="username" value="{{ username or '' }}" required minlength="3" maxlength="32" autocomplete="username" autofocus>
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
      </div>
      <div class="form-row">
        <label>Confirm Password</label>
        <input type="password" name="password_confirm" required minlength="8" maxlength="128" autocomplete="new-password">
      </div>
      <div class="form-actions">
        <button type="submit" class="primary">Create Account</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
