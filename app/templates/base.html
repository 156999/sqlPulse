<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SQL Pulse{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.10/dist/htmx.min.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">SQL&nbsp;Pulse</div>
    <nav>
      <a href="/runs/new" {% block nav_new %}{% endblock %}>新建压测</a>
      <a href="/datagen" {% block nav_datagen %}{% endblock %}>造数</a>
      <a href="/runs" {% block nav_runs %}{% endblock %}>历史任务</a>
    </nav>
    <div class="sidebar-foot">MVP · SQL Boys</div>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
