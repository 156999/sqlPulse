{% extends "base.html" %}
{% block title %}登录 · SQL Pulse{% endblock %}
{% block nav_login %}class="active"{% endblock %}
{% block content %}
<div class="auth-panel">
  <div class="card auth-card">
    <h1>登录 SQL Pulse</h1>
    {% if error %}<p class="hint err auth-error">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="auth-form">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-row">
        <label>用户名</label>
        <input type="text" name="username" value="{{ username or '' }}" required minlength="3" maxlength="32" autocomplete="username" autofocus>
      </div>
      <div class="form-row">
        <label>密码</label>
        <input type="password" name="password" required autocomplete="current-password">
      </div>
      <div class="form-actions">
        <button type="submit" class="primary">登录</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
