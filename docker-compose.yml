services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - TARGET_DB_HOST=mysql
      - TARGET_DB_PORT=3306
      - TARGET_DB_USER=root
      - TARGET_DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-s3cret}
      - TARGET_DB_NAME=sqlpulse_demo
      - DATAGEN_SCRIPT_EXECUTION_ENABLED=${DATAGEN_SCRIPT_EXECUTION_ENABLED:-false}
      - DATAGEN_SQL_TIMEOUT_SEC=${DATAGEN_SQL_TIMEOUT_SEC:-300}
      - DATAGEN_SCRIPT_TIMEOUT_SEC=${DATAGEN_SCRIPT_TIMEOUT_SEC:-3600}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-dev-only-secret-change-me}
      - AUTH_SESSION_TTL_SECONDS=${AUTH_SESSION_TTL_SECONDS:-604800}
      - AUTH_SESSION_COOKIE=${AUTH_SESSION_COOKIE:-sqlpulse_session}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_ALLOW_REGISTER=${AUTH_ALLOW_REGISTER:-true}
      - AUTH_SEED_ROOT=${AUTH_SEED_ROOT:-true}
    volumes:
      - sqlpulse_data:/app/data
      - sqlpulse_logs:/app/logs
      - sqlpulse_reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-s3cret}
      MYSQL_DATABASE: sqlpulse_demo
    # 宿主机端口默认 3307，避免与已有 MySQL 的 3306 冲突；web 容器经内部网络访问 mysql:3306 不受影响
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/seed_demo.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlpulse_data:
  sqlpulse_logs:
  sqlpulse_reports:
  mysql_data:
