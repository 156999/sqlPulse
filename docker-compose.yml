services:
  web:
    build: .
    ports: ["8080:8080"]
    environment:
      - TARGET_DB_HOST=mysql
      - TARGET_DB_PORT=3306
      - TARGET_DB_USER=root
      - TARGET_DB_PASSWORD=s3cret
      - TARGET_DB_NAME=sqlpulse_demo
      - DATAGEN_SCRIPT_EXECUTION_ENABLED=${DATAGEN_SCRIPT_EXECUTION_ENABLED:-false}
      - DATAGEN_SQL_TIMEOUT_SEC=${DATAGEN_SQL_TIMEOUT_SEC:-300}
      - DATAGEN_SCRIPT_TIMEOUT_SEC=${DATAGEN_SCRIPT_TIMEOUT_SEC:-3600}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: s3cret
      MYSQL_DATABASE: sqlpulse_demo
    # 宿主机端口用 3307，避免与已有 MySQL 的 3306 冲突；web 容器经内部网络访问 mysql:3306 不受影响
    ports: ["3307:3306"]
    volumes:
      - ./scripts/seed_demo.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ps3cret"]
      interval: 5s
      retries: 12
