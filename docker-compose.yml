# 产品部署文件：只含 SQL Pulse 本体，不带任何被测数据库。
# 目标 MySQL 由使用者在「新建连接」页面填写（ip + port + 凭证），
# 可以是本机、局域网或云上的任意实例 —— 部署时不需要、也不应该由我们代劳。
# 自动化测试与演示用的 MySQL 夹具单独放在 docker-compose.mysql.yml，不参与产品部署。
services:
  web:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      # 以下 5 项只是「新建连接」表单的初始值，应用启动时不会去连任何库。
      # 默认留空，让使用者填自己那台 MySQL；容器内写 localhost 指的是容器本身，天然是错的。
      - TARGET_DB_HOST=${TARGET_DB_HOST:-}
      - TARGET_DB_PORT=${TARGET_DB_PORT:-3306}
      - TARGET_DB_USER=${TARGET_DB_USER:-}
      - TARGET_DB_PASSWORD=${TARGET_DB_PASSWORD:-}
      - TARGET_DB_NAME=${TARGET_DB_NAME:-}
      - DATAGEN_SCRIPT_EXECUTION_ENABLED=${DATAGEN_SCRIPT_EXECUTION_ENABLED:-false}
      - DATAGEN_SQL_TIMEOUT_SEC=${DATAGEN_SQL_TIMEOUT_SEC:-300}
      - DATAGEN_SCRIPT_TIMEOUT_SEC=${DATAGEN_SCRIPT_TIMEOUT_SEC:-3600}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-dev-only-secret-change-me}
      # 连接密码加密密钥：AUTH_ENABLED=true 时必填，缺失会导致 web 启动失败
      - SQLPULSE_CREDENTIAL_KEY=${SQLPULSE_CREDENTIAL_KEY:-}
      - SQLPULSE_CREDENTIAL_KEY_VERSION=${SQLPULSE_CREDENTIAL_KEY_VERSION:-v1}
      - AUTH_SESSION_TTL_SECONDS=${AUTH_SESSION_TTL_SECONDS:-604800}
      - AUTH_SESSION_COOKIE=${AUTH_SESSION_COOKIE:-sqlpulse_session}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_ALLOW_REGISTER=${AUTH_ALLOW_REGISTER:-true}
      - AUTH_SEED_ROOT=${AUTH_SEED_ROOT:-true}
    volumes:
      - sqlpulse_data:/app/data
      - sqlpulse_logs:/app/logs
      - sqlpulse_reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  sqlpulse_data:
  sqlpulse_logs:
  sqlpulse_reports:
